<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprova OAB — 48º Exame</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
:root{
  --bg:#0b1120; --bg2:#0f172a; --card:#141d33; --card2:#1a2540;
  --border:#243252; --text:#e8edf7; --muted:#94a3c2;
  --accent:#4f7cff; --accent2:#7c5cff; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --gold:#d4af37;
}
[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f0f3fa;
  --border:#e2e8f5; --text:#111827; --muted:#5b6784;
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; padding-bottom:78px;
}
a{color:inherit}
.wrap{max-width:1100px; margin:0 auto; padding:16px}
.hide{display:none!important}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; font-size:15px; width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent)}
label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px; font-weight:600}
.field{margin-bottom:14px}
.btn{
  background:var(--accent); color:#fff; border:none; border-radius:10px; padding:11px 18px;
  font-weight:700; font-size:15px; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--border)}
.btn.danger{background:var(--bad)}
.btn.good{background:var(--good)}
.btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text)}
.btn.sm{padding:7px 12px; font-size:13px}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* Top bar */
.topbar{
  position:sticky; top:0; z-index:50; background:rgba(11,17,32,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
}
[data-theme="light"] .topbar{background:rgba(255,255,255,.92)}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px}
.brand .dot{width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2))}
.topbar-actions{display:flex; gap:8px; align-items:center}
.iconbtn{background:var(--card2); border:1px solid var(--border); border-radius:10px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:16px}

/* Bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:60; background:var(--bg2); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; padding:6px 2px calc(6px + env(safe-area-inset-bottom));
}
.navitem{
  display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:10px;
  padding:6px 4px; border-radius:10px; flex:1; text-align:center; background:none; border:none;
}
.navitem.active{color:var(--accent)}
.navitem .ic{font-size:19px}

/* Cards */
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px}
.card-title{font-size:13px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:10px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr}}

/* Countdown hero */
.hero{
  background:linear-gradient(135deg,#1a2b5c,#2a1a5c); border-radius:20px; padding:26px 22px; margin-bottom:16px;
  position:relative; overflow:hidden; border:1px solid var(--border);
}
.hero .label{font-size:12px; color:#a8b6ff; text-transform:uppercase; letter-spacing:1px; font-weight:700}
.hero .big{font-size:44px; font-weight:900; line-height:1.05; margin:6px 0; color:#fff}
.hero .sub{color:#c3cbf5; font-size:14px}
.hero-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px}
.hero-chip{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px 14px; flex:1; min-width:130px}
.hero-chip .n{font-size:20px; font-weight:800; color:#fff}
.hero-chip .l{font-size:11px; color:#c3cbf5}

.progress-bar{background:var(--card2); border-radius:99px; height:10px; overflow:hidden; margin-top:6px}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:99px; transition:width .3s}

.stat-num{font-size:26px; font-weight:800}
.stat-label{font-size:12px; color:var(--muted); font-weight:600}

.badge{display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700}
.badge.good{background:rgba(34,197,94,.15); color:var(--good)}
.badge.bad{background:rgba(239,68,68,.15); color:var(--bad)}
.badge.warn{background:rgba(245,158,11,.15); color:var(--warn)}
.badge.neutral{background:rgba(148,163,194,.15); color:var(--muted)}

.list-item{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}

/* Question card */
.qcard{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px}
.qmeta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.qtag{font-size:11px; padding:3px 9px; border-radius:99px; background:var(--card2); color:var(--muted); border:1px solid var(--border)}
.qtext{font-size:16px; line-height:1.55; margin-bottom:18px; white-space:pre-wrap}
.alt{
  display:flex; gap:10px; align-items:flex-start; padding:13px 14px; border:1px solid var(--border); border-radius:12px;
  margin-bottom:10px; background:var(--card2);
}
.alt:hover{border-color:var(--accent)}
.alt.selected{border-color:var(--accent); background:rgba(79,124,255,.12)}
.alt.correct{border-color:var(--good); background:rgba(34,197,94,.14)}
.alt.wrong{border-color:var(--bad); background:rgba(239,68,68,.14)}
.alt .letter{width:26px; height:26px; border-radius:8px; background:var(--card); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; border:1px solid var(--border)}
.alt.correct .letter{background:var(--good); color:#fff; border-color:var(--good)}
.alt.wrong .letter{background:var(--bad); color:#fff; border-color:var(--bad)}
.explain{background:var(--card2); border-radius:12px; padding:14px; margin-top:14px; border-left:3px solid var(--accent); font-size:14px; line-height:1.6}

.flashcard{
  background:linear-gradient(145deg,var(--card),var(--card2)); border:1px solid var(--border); border-radius:20px;
  min-height:220px; display:flex; align-items:center; justify-content:center; text-align:center; padding:28px;
  font-size:18px; font-weight:600; cursor:pointer; user-select:none; line-height:1.5;
}
.flashcard .hint{position:absolute; bottom:14px; font-size:11px; color:var(--muted); font-weight:400}

.tab-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px}
.chip-tab{white-space:nowrap; padding:8px 14px; border-radius:99px; background:var(--card2); border:1px solid var(--border); font-size:13px; font-weight:600; color:var(--muted)}
.chip-tab.active{background:var(--accent); color:#fff; border-color:var(--accent)}

table{width:100%; border-collapse:collapse; font-size:13px}
th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--border)}
th{color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase}

.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center}
@media(min-width:720px){.modal-bg{align-items:center}}
.modal{background:var(--bg2); border-radius:20px 20px 0 0; padding:22px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border:1px solid var(--border)}
@media(min-width:720px){.modal{border-radius:20px}}
.modal h3{margin-bottom:16px; font-size:18px}
.modal-close{float:right; background:none; border:none; color:var(--muted); font-size:20px}

.empty{text-align:center; padding:40px 20px; color:var(--muted)}
.empty .ic{font-size:40px; margin-bottom:10px}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--border); padding:11px 20px; border-radius:99px; font-size:14px; z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.3)}

.onb-step{display:none}
.onb-step.active{display:block}
.onb-dots{display:flex; gap:6px; justify-content:center; margin:18px 0}
.onb-dot{width:8px; height:8px; border-radius:50%; background:var(--border)}
.onb-dot.active{background:var(--accent); width:20px}
.opt-btn{display:block; width:100%; text-align:left; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--card2); color:var(--text); margin-bottom:10px; font-size:15px}
.opt-btn.selected{border-color:var(--accent); background:rgba(79,124,255,.12)}

.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.login-card{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:30px; width:100%; max-width:400px}
.xp-bar{height:8px; background:var(--card2); border-radius:99px; overflow:hidden}
.streak-flame{font-size:22px}
</style>
</head>

var DEMO_QUESTOES = [
  {disc:"Ética Profissional (EOAB)", tema:"Sigilo profissional", enunciado:"De acordo com o Código de Ética e Disciplina da OAB, o sigilo profissional é:", alts:{A:"Uma faculdade do advogado, que pode revelar informações do cliente se entender conveniente.",B:"Direito e dever do advogado, essencial ao exercício da profissão, com exceções restritas previstas em lei.",C:"Aplicável apenas a processos criminais.",D:"Dispensado quando o cliente autoriza verbalmente, sem necessidade de registro."}, gabarito:"B", comentario:"O sigilo profissional é previsto no art. 25 e seguintes do Código de Ética e Disciplina da OAB como direito e dever do advogado, decorrente da necessidade de confiança na relação cliente-advogado. Só pode ser quebrado em hipóteses excepcionais e restritas.", dificuldade:"facil", ano:2025, exame:"47º Exame"},

function seedDemoData(){
  if(!FIREBASE_READY){ toast("Configure o Firebase antes de carregar dados."); return; }
  var batch = db.batch();
  var discRefs = {};
  DEMO_DISCIPLINAS.forEach(function(d){
    var ref = db.collection("disciplinas").doc();
    discRefs[d.nome] = ref.id;
    batch.set(ref, d);
  });
  batch.commit().then(function(){
    var batch2 = db.batch();
    DEMO_QUESTOES.forEach(function(q){
      var ref = db.collection("questoes").doc();
      batch2.set(ref, {

  if(name==="flashcards" && !S.loaded.flash){

      S.flashcards = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });

  }
  if(name==="flashRev" && !S.loaded.flashRev){

      S.flashReviews = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      rT();
    }, function(e){ console.error(e); });
  }
  if(name==="simulados" && !S.loaded.sim){
    S.loaded.sim = true;
    db.collection("simulados").onSnapshot(function(snap){
      S.simulados = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });

    content = '<h3>Quais disciplinas considera mais fáceis?</h3>'+

function opt(name,val,label){
  var sel = onbData[name.replace("onb-","")]===val;
  return '<button type="button" class="opt-btn'+(sel?' selected':'')+'" data-onb-opt="'+name+'" data-onb-val="'+es(val)+'">'+es(label)+'</button>';
}
function multiOpt(name,val){
  var key = name.replace("onb-","");
  var arr = onbData[key]||[];
  var sel = arr.indexOf(val)>=0;
  return '<button type="button" class="opt-btn'+(sel?' selected':'')+'" data-onb-multi="'+name+'" data-onb-val="'+es(val)+'">'+es(val)+'</button>';
}
function statChip(n,l){ return '<div class="hero-chip" style="background:var(--card2);border-color:var(--border)"><div class="n" style="color:var(--text)">'+n+'</div><div class="l" style="color:var(--muted)">'+l+'</div></div>'; }

  if(step===4){ onbData.horas = document.getElementById("onb-horas").value; onbData.dias = document.getElementById("onb-dias").value; }

function indicePreparacaoHTML(){
  var idx = calcIndicePreparacao();
  var cor = idx.score>=75?"good":idx.score>=50?"warn":"bad";
  return '<div style="text-align:center;padding:8px 0">'+
    '<div style="font-size:36px;font-weight:900;color:var(--'+cor+')">'+idx.score+'</div>'+
    '<div style="color:var(--muted);font-size:12px;margin-bottom:10px">de 100</div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+idx.score+'%;background:var(--'+cor+')"></div></div>'+
    '<div style="font-size:13px;color:var(--muted);margin-top:10px">'+es(idx.msg)+'</div>'+
  '</div>';
}
function calcIndicePreparacao(){
  var total = S.tentativas.length;
  var corretas = S.tentativas.filter(function(t){return t.correta;}).length;
  var acerto = total ? pct(corretas,total) : 0;
  var volume = Math.min(100, pct(total,300));
  var sims = S.simResultados.length;
  var revFeitas = S.flashReviews.length;
  var score = Math.round(acerto*0.45 + volume*0.25 + Math.min(100,sims*20)*0.15 + Math.min(100,revFeitas*2)*0.15);
  score = Math.max(0, Math.min(100, score));
  var fracos = calcPontosFracos();
  var msg = total===0 ? "Comece respondendo questões para calcularmos seu índice." :
    (score>=75 ? "Ótimo ritmo. Continue mantendo a consistência." :
     score>=50 ? "Você está evoluindo. Seu principal ponto de atenção é "+(fracos[0]?fracos[0].nome:"revisar mais")+"." :
     "Ainda no início da jornada. Foque em volume de questões e revisões regulares.");
  return {score:score, msg:msg};
}
function calcPontosFracos(){
  var porDisc = {};
  S.tentativas.forEach(function(t){
    var d = t.disciplinaNome||"—";
    if(!porDisc[d]) porDisc[d]={acertos:0,total:0};
    porDisc[d].total++;
    if(t.correta) porDisc[d].acertos++;
  });
  var arr = Object.keys(porDisc).map(function(k){ return {nome:k, pct:pct(porDisc[k].acertos,porDisc[k].total), total:porDisc[k].total}; });
  arr = arr.filter(function(a){ return a.total>=1; });
  arr.sort(function(a,b){ return a.pct-b.pct; });
  return arr;
}
function revisoesPendentes(){
  var now = Date.now();
  return S.flashReviews.filter(function(r){ return r.proximaRevisao && r.proximaRevisao<=now; });
}

/* =========================================================
   10) PLANO DE ESTUDOS
   ========================================================= */
var DIAS_SEMANA = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
function gerarPlanoSemana(){
  var p = S.perfil||{};
  var discs = S.disciplinas.length ? S.disciplinas : DEMO_DISCIPLINAS.map(function(d,i){return Object.assign({id:"demo"+i},d);});
  var fracos = calcPontosFracos();
  var prioridades = discs.map(function(d){
    var fraco = fracos.find(function(f){ return f.nome===d.nome; });
    var pesoDesempenho = fraco ? (100-fraco.pct) : 40;
    var pesoDificil = (p.disciplinasDificeis||[]).indexOf(d.nome)>=0 ? 20 : 0;
    var score = (d.peso||5)*3 + pesoDesempenho*0.6 + pesoDificil;
    return {nome:d.nome, score:score};
  }).sort(function(a,b){ return b.score-a.score; });

  var diasSemana = p.diasSemana||5;
  var horasDia = p.horasDia||2;
  var minutosDia = Math.round(horasDia*60);
  var diasAtivos = [1,2,3,4,5,6,0].slice(0,diasSemana); // seg..dom

  var plano = [];
  diasAtivos.forEach(function(diaIdx, i){
    var d1 = prioridades[i % prioridades.length];
    var d2 = prioridades[(i+1) % prioridades.length];
    var tStudy = Math.round(minutosDia*0.35);
    var tQuest = Math.round(minutosDia*0.3);
    var tRev = Math.round(minutosDia*0.2);
    var tFlash = Math.max(10, minutosDia - tStudy*2 - tQuest - tRev);
    plano.push({
      dia: DIAS_SEMANA[diaIdx],
      itens:[
        {tipo:"Estudo", nome:d1.nome, min:tStudy},
        {tipo:"Estudo", nome:d2.nome, min:Math.round(minutosDia*0.15)},
        {tipo:"Questões", nome:"Prática mista", min:tQuest},
        {tipo:"Revisão", nome:"Revisão espaçada", min:tRev},
        {tipo:"Flashcards", nome:"Cartões do dia", min:tFlash}
      ]
    });
  });
  return plano;
}
function rPlano(){
  var plano = gerarPlanoSemana();
  var p = S.perfil||{};
  var pouco = S.showPoucoTempo;
  return '<div class="card">'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div class="card-title" style="margin-bottom:0">Cronograma da semana</div>'+
      '<button class="btn secondary sm" data-toggle-pouco-tempo>⏱ Tenho pouco tempo</button>'+
    '</div>'+
    '<p style="color:var(--muted);font-size:13px;margin-top:8px">Baseado em '+esc0(p.horasDia)+'h/dia, '+esc0(p.diasSemana)+' dias/semana e nas disciplinas onde você mais precisa evoluir.</p>'+
  '</div>'+
  (pouco?rPoucoTempo():"")+
  plano.map(function(d){
    return '<div class="card"><div class="card-title">'+es(d.dia)+'</div>'+
      d.itens.map(function(it){
        return '<div class="list-item"><span>'+iconTipo(it.tipo)+' '+es(it.nome)+'</span><span class="badge neutral">'+it.min+' min</span></div>';
      }).join("")+
    '</div>';
  }).join("");
}

function questoesFiltradas(){
  var arr = S.questoes.slice();
  if(S.qFiltroDisc) arr = arr.filter(function(q){ return q.disciplinaId===S.qFiltroDisc; });
  if(S.qFiltroDificuldade) arr = arr.filter(function(q){ return q.dificuldade===S.qFiltroDificuldade; });
  if(S.qFiltroStatus==="naorespondidas"){
    var respondidasIds = S.tentativas.map(function(t){return t.questaoId;});
    arr = arr.filter(function(q){ return respondidasIds.indexOf(q.id)<0; });
  }
  if(S.qFiltroStatus==="erradas"){
    var erradasIds = S.tentativas.filter(function(t){return !t.correta;}).map(function(t){return t.questaoId;});
    arr = arr.filter(function(q){ return erradasIds.indexOf(q.id)>=0; });
  }
  if(S.qFiltroStatus==="favoritas"){
    var favs = JSON.parse(localStorage.getItem("oab_favoritas")||"[]");
    arr = arr.filter(function(q){ return favs.indexOf(q.id)>=0; });
  }
  return arr;
}

function iniciarSessao(modo, n){
  var pool;
  if(modo==="erros"){
    var erradasIds = S.tentativas.filter(function(t){return !t.correta;}).map(function(t){return t.questaoId;});
    pool = S.questoes.filter(function(q){ return erradasIds.indexOf(q.id)>=0; });
  } else if(modo==="filtro"){
    pool = questoesFiltradas();
  } else if(modo==="pouco"){
    pool = S.questoes.slice();
    n = S.planoPouco ? S.planoPouco.questoes : 10;
  } else {
    pool = S.questoes.slice();
  }
  if(!pool.length){ toast("Nenhuma questão disponível para esse modo."); return; }
  pool = pool.sort(function(){return Math.random()-0.5;});
  if(n) pool = pool.slice(0,n);
  S.qSessao = {questoes:pool, idx:0, respostas:{}, respondeuAtual:false, inicioEm:Date.now()};
  rT();
}

function responderQuestao(qid, letra){
  var sess = S.qSessao;
  if(sess.respostas[qid]!==undefined) return;
  sess.respostas[qid] = letra;
  var q = sess.questoes.find(function(x){return x.id===qid;});
  var correta = letra===q.gabarito;

function registrarTentativa(q, resposta, correta){
  if(!FIREBASE_READY || !S.user) return;

    tema:q.tema, respostaEscolhida:resposta, correta:correta, data:new Date().toISOString()
  });
  ganharXP(correta?12:4);

/* =========================================================
   12) REVISÃO ESPAÇADA (aplica-se a questões erradas via flashReviews genérico)
   ========================================================= */
function agendarRevisao(q, correta){
  if(!FIREBASE_READY || !S.user) return;
  var key = "q_"+q.id;
  var existente = S.flashReviews.find(function(r){ return r.itemId===key; });
  var nivel = existente ? (correta ? Math.min(existente.nivel+1,3) : 0) : 0;
  var dias = REVISAO_INTERVALOS[nivel];
  var proxima = Date.now() + dias*86400000;
  var payload = {userId:S.user.uid, itemId:key, tipo:"questao", refId:q.id, nivel:nivel, proximaRevisao:proxima, atualizadoEm:Date.now()};
  if(existente) db.collection("flashReviews").doc(existente.id).set(payload);
  else db.collection("flashReviews").add(payload);
}
function ganharXP(n){
  if(!FIREBASE_READY || !S.user || !S.perfil) return;
  var novoXP = (S.perfil.xp||0)+n;
  var hoje = todayStr();
  var streak = S.perfil.streak||0;
  if(S.perfil.ultimoEstudo!==hoje){
    var ontem = new Date(); ontem.setDate(ontem.getDate()-1);
    streak = (S.perfil.ultimoEstudo===ontem.toISOString().slice(0,10)) ? streak+1 : 1;
  }
  db.collection("perfis").doc(S.user.uid).update({xp:novoXP, streak:streak, ultimoEstudo:hoje, nivel:Math.floor(novoXP/200)+1});
}

/* =========================================================
   18) NAVEGAÇÃO / RENDER MASTER
   ========================================================= */
function rNav(){
  return '<div class="bottomnav">'+
    NAV.map(function(n){ return '<button class="navitem'+(S.tab===n.id?' active':'')+'" data-goto="'+n.id+'"><span class="ic">'+n.ic+'</span>'+n.label+'</button>'; }).join("")+
  '</div>';
}
function rTopbar(){
  var titles = {dashboard:"Início", plano:"Plano de estudos", questoes:"Questões", simulados:"Simulados", flashcards:"Flashcards", desempenho:"Desempenho", perfil:"Perfil", admin:"Administração"};
  return '<div class="topbar"><div class="brand"><span class="dot"></span>'+ (titles[S.tab]||"Aprova OAB") +'</div>'+
    '<div class="topbar-actions"><button class="iconbtn" data-set-theme="'+(S.theme==="dark"?"light":"dark")+'">'+(S.theme==="dark"?"☀️":"🌙")+'</button></div>'+
  '</div>';
}
function rT(){
  document.documentElement.setAttribute("data-theme", S.theme);
  var app = document.getElementById("app");
  if(!FIREBASE_READY){
    app.innerHTML = '<div class="center-screen"><div class="login-card"><h3>⚙️ Configuração necessária</h3>'+
      '<p style="color:var(--muted);margin-top:10px;font-size:14px">Este app precisa de um projeto Firebase próprio. Abra o arquivo <code>index.html</code>, encontre <code>firebaseConfig</code> no topo do script e cole os dados do seu projeto (Firebase Console → Configurações do projeto → Seus apps → Config).</p></div></div>';
    return;
  }
  if(!S.user){
    app.innerHTML = rAuthScreen();
    return;
  }
  if(!S._perfilLoaded){
    app.innerHTML = '<div class="center-screen"><div style="color:var(--muted)">Carregando seu perfil...</div></div>';
    return;
  }
  if(!S.perfil){
    app.innerHTML = rOnboarding();
    attachOnboardingEvents();
    return;
  }

  var body = "";
  if(S.tab==="dashboard") body = rDashboard();
  else if(S.tab==="plano") body = rPlano();
  else if(S.tab==="questoes") body = rQuestoes();
  else if(S.tab==="simulados") body = S.simResultadoFinal ? rSimFinalResumo() : rSimulados();
  else if(S.tab==="flashcards") body = rFlashcards();
  else if(S.tab==="desempenho") body = rDesempenho();
  else if(S.tab==="perfil") body = rPerfil();
  else if(S.tab==="admin") body = rAdmin();

  app.innerHTML = rTopbar() + '<div class="wrap">'+body+'</div>' + rNav() + rModal();
}

    '<div style="color:var(--accent);font-weight:700">'+r.pct+'% de aproveitamento</div>'+
    '<div style="color:var(--muted);font-size:13px;margin-top:8px">Tempo total: '+Math.round(r.tempoSeg/60)+' min</div>'+
    '<button class="btn" style="margin-top:20px" data-fechar-resultado-sim>Ver histórico</button>'+
  '</div>';
}

    )+
  '</div></div>';

/* =========================================================
   19) EVENTOS (delegação única)
   ========================================================= */
document.addEventListener("click", function(e){
  var _t;

  if((_t=e.target.closest("[data-goto]"))){
    S.tab = _t.dataset.goto;
    S.qSessao=null; S.simResultadoFinal=null;
    if(_t.dataset.focoFracos){ /* mantem, futuro: pré-filtrar */ }
    rT(); return;
  }
  if((_t=e.target.closest("[data-switch-auth]"))){ e.preventDefault(); S.authMode=_t.dataset.switchAuth; rT(); return; }
  if((_t=e.target.closest("[data-do-login]"))){
    var em=document.getElementById("auth-email").value.trim(), pw=document.getElementById("auth-pass").value;
    doLogin(em,pw); return;
  }
  if((_t=e.target.closest("[data-do-signup]"))){
    var nm=document.getElementById("auth-nome").value.trim(), em2=document.getElementById("auth-email").value.trim(), pw2=document.getElementById("auth-pass").value;
    doSignup(em2,pw2,nm); return;
  }
  if((_t=e.target.closest("[data-logout]"))){ doLogout(); return; }
  if((_t=e.target.closest("[data-set-theme]"))){ saveTheme(_t.dataset.setTheme); return; }

  // onboarding
  if((_t=e.target.closest("[data-onb-opt]"))){
    var key = _t.dataset.onbOpt.replace("onb-",""); onbData[key] = _t.dataset.onbVal; rT(); return;
  }
  if((_t=e.target.closest("[data-onb-multi]"))){
    var key2 = _t.dataset.onbMulti.replace("onb-",""); var v = _t.dataset.onbVal;
    var arr = onbData[key2]||[]; var i=arr.indexOf(v);
    if(i>=0) arr.splice(i,1); else arr.push(v);
    onbData[key2]=arr; rT(); return;
  }
  if((_t=e.target.closest("[data-onb-next]"))){
    saveOnboardingStep();
    var step=S.onbStep||1;
    if(step>=ONB_TOTAL){ finishOnboarding(); return; }
    S.onbStep = step+1; rT(); return;
  }
  if((_t=e.target.closest("[data-onb-back]"))){ S.onbStep=Math.max(1,(S.onbStep||1)-1); rT(); return; }

  // plano
  if((_t=e.target.closest("[data-toggle-pouco-tempo]"))){ S.showPoucoTempo=!S.showPoucoTempo; rT(); return; }
  if((_t=e.target.closest("[data-gerar-pouco]"))){
    var min = parseInt(document.getElementById("pouco-min").value||30);
    S.planoPouco = gerarPlanoPouco(min); rT(); return;
  }

  // questões
  if((_t=e.target.closest("[data-iniciar-sessao]"))){
    iniciarSessao(_t.dataset.iniciarSessao, _t.dataset.n?parseInt(_t.dataset.n):null); return;
  }
  if((_t=e.target.closest("[data-responder]"))){ responderQuestao(_t.dataset.qid, _t.dataset.responder); return; }
  if((_t=e.target.closest("[data-sess-next]"))){ S.qSessao.idx++; rT(); return; }
  if((_t=e.target.closest("[data-sess-prev]"))){ S.qSessao.idx--; rT(); return; }
  if((_t=e.target.closest("[data-encerrar-sessao]"))){ S.qSessao=null; rT(); return; }
  if((_t=e.target.closest("[data-fav-questao]"))){
    var favs = JSON.parse(localStorage.getItem("oab_favoritas")||"[]");
    var qid = _t.dataset.favQuestao; var i2 = favs.indexOf(qid);
    if(i2>=0) favs.splice(i2,1); else favs.push(qid);
    localStorage.setItem("oab_favoritas", JSON.stringify(favs)); rT(); return;
  }
  if((_t=e.target.closest("[data-add-erro]"))){ toast("Já está no seu caderno de erros automaticamente 👍"); return; }
  if((_t=e.target.closest("[data-filtro-status]"))){ S.qFiltroStatus=_t.dataset.filtroStatus; rT(); return; }

  // flashcards
  if((_t=e.target.closest("[data-abrir-deck]"))){ S.flashDeckAtual=_t.dataset.abrirDeck; S.flashIdx=0; S.flashVirado=false; rT(); return; }
  if((_t=e.target.closest("[data-fechar-deck]"))){ S.flashDeckAtual=null; rT(); return; }
  if((_t=e.target.closest("[data-virar-card]"))){ S.flashVirado=!S.flashVirado; rT(); return; }
  if((_t=e.target.closest("[data-classificar-flash]"))){ classificarFlash(_t.dataset.fid, _t.dataset.classificarFlash); return; }

  // simulados
  if((_t=e.target.closest("[data-criar-simulado]"))){ criarSimulado(_t.dataset.criarSimulado); return; }
  if((_t=e.target.closest("[data-sim-responder]"))){
    var letra = _t.textContent.trim()[0];
    var q = S.simAtivo.questoes[S.simAtivo.idx];
    S.simAtivo.respostas[q.id] = _t.dataset.simResponder; rT(); return;
  }
  if((_t=e.target.closest("[data-sim-marcar]"))){
    var q2 = S.simAtivo.questoes[S.simAtivo.idx];
    S.simAtivo.marcadas[q2.id] = !S.simAtivo.marcadas[q2.id]; rT(); return;
  }
  if((_t=e.target.closest("[data-sim-next]"))){ S.simAtivo.idx++; rT(); return; }
  if((_t=e.target.closest("[data-sim-prev]"))){ S.simAtivo.idx--; rT(); return; }
  if((_t=e.target.closest("[data-sim-goto]"))){ S.simAtivo.idx=parseInt(_t.dataset.simGoto); rT(); return; }
  if((_t=e.target.closest("[data-sim-finalizar]"))){ finalizarSimulado(); return; }
  if((_t=e.target.closest("[data-fechar-resultado-sim]"))){ S.simResultadoFinal=null; rT(); return; }

  // admin
  if((_t=e.target.closest("[data-admin-sub]"))){ S.adminSub=_t.dataset.adminSub; rT(); return; }
  if((_t=e.target.closest("[data-seed-demo]"))){ seedDemoData(); return; }
  if((_t=e.target.closest("[data-salvar-datas]"))){
    var upd = {};
    ["editalPub","inscricaoInicio","inscricaoFim","fase1","fase2"].forEach(function(k){ upd[k]=document.getElementById("date-"+k).value; });
    upd.nomeExame = "48º Exame da OAB";
    db.collection("config").doc("examDates").set(upd,{merge:true}).then(function(){ toast("Datas atualizadas!"); }); return;
  }
  if((_t=e.target.closest("[data-nova-disciplina]"))){ modalNovaDisciplina(); return; }
  if((_t=e.target.closest("[data-salvar-disciplina]"))){
    var nome=document.getElementById("m-nome").value.trim(), peso=parseInt(document.getElementById("m-peso").value||5);
    if(!nome){ toast("Informe o nome."); return; }
    db.collection("disciplinas").add({nome:nome, peso:peso, ordem:S.disciplinas.length+1}).then(function(){ closeModal(); toast("Disciplina criada."); }); return;
  }
  if((_t=e.target.closest("[data-del-disciplina]"))){ if(confirm("Excluir disciplina?")) db.collection("disciplinas").doc(_t.dataset.delDisciplina).delete(); return; }
  if((_t=e.target.closest("[data-nova-questao]"))){ modalNovaQuestao(); return; }
  if((_t=e.target.closest("[data-salvar-questao]"))){
    var discId=document.getElementById("m-disc").value;
    var discObj = S.disciplinas.find(function(d){return d.id===discId;});
    var payload = {
      disciplinaId:discId, disciplinaNome:discObj?discObj.nome:"", tema:document.getElementById("m-tema").value.trim(),
      enunciado:document.getElementById("m-enunciado").value.trim(),
      alternativas:{A:document.getElementById("m-a").value.trim(),B:document.getElementById("m-b").value.trim(),C:document.getElementById("m-c").value.trim(),D:document.getElementById("m-d").value.trim()},
      gabarito:document.getElementById("m-gabarito").value, comentario:document.getElementById("m-comentario").value.trim(),
      dificuldade:document.getElementById("m-dif").value, criadoEm:Date.now()
    };
    if(!payload.enunciado){ toast("Informe o enunciado."); return; }
    db.collection("questoes").add(payload).then(function(){ closeModal(); toast("Questão criada."); }); return;
  }
  if((_t=e.target.closest("[data-del-questao]"))){ if(confirm("Excluir questão?")) db.collection("questoes").doc(_t.dataset.delQuestao).delete(); return; }
  if((_t=e.target.closest("[data-novo-flashcard]"))){ modalNovoFlashcard(); return; }
  if((_t=e.target.closest("[data-salvar-flashcard]"))){
    var discId2=document.getElementById("m-disc").value;
    var discObj2 = S.disciplinas.find(function(d){return d.id===discId2;});
    var payload2 = {disciplinaId:discId2, disciplinaNome:discObj2?discObj2.nome:"", frente:document.getElementById("m-frente").value.trim(), verso:document.getElementById("m-verso").value.trim(), criadoEm:Date.now()};
    if(!payload2.frente){ toast("Informe a frente do cartão."); return; }
    db.collection("flashcards").add(payload2).then(function(){ closeModal(); toast("Flashcard criado."); }); return;
  }
  if((_t=e.target.closest("[data-del-flashcard]"))){ if(confirm("Excluir flashcard?")) db.collection("flashcards").doc(_t.dataset.delFlashcard).delete(); return; }

  if((_t=e.target.closest("[data-salvar-perfil]"))){
    var horas=parseFloat(document.getElementById("perfil-horas").value||2), dias=parseInt(document.getElementById("perfil-dias").value||5);
    db.collection("perfis").doc(S.user.uid).update({horasDia:horas, diasSemana:dias, metaDiariaMin:Math.round(horas*60)}).then(function(){ toast("Perfil atualizado."); }); return;
  }

  if((_t=e.target.closest("[data-close-modal]"))){ closeModal(); return; }
});

function attachOnboardingEvents(){ /* eventos já cobertos pela delegação global */ }

/* =========================================================
   20) INICIALIZAÇÃO
   ========================================================= */
document.documentElement.setAttribute("data-theme", S.theme);
rT();
</script>
